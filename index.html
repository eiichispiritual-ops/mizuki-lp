<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>みづき LP プレビュー</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F0D14;color:#F4EFE6;font-family:"Shippori Mincho B1",serif;
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;line-height:2}
.w{max-width:520px;width:100%}
h1{font-size:20px;letter-spacing:.2em;text-align:center;margin-bottom:8px;font-weight:800}
.sub{text-align:center;font-size:11px;letter-spacing:.4em;color:#8B85A3;
font-family:"Cormorant Garamond",serif;margin-bottom:44px}
a.card{display:block;text-decoration:none;color:inherit;margin-bottom:20px;padding:28px 24px;
border:1px solid rgba(201,162,75,.3);background:linear-gradient(180deg,rgba(26,24,48,.6),rgba(15,13,20,.3));
transition:border-color .3s,background .3s}
a.card:hover{border-color:rgba(201,162,75,.8);background:rgba(201,162,75,.08)}
.no{font-family:"Cormorant Garamond",serif;font-size:11px;letter-spacing:.34em;color:#C9A24B;margin-bottom:10px}
.ttl{font-size:18px;font-weight:600;color:#F5DFA0;margin-bottom:8px;letter-spacing:.1em}
.desc{font-size:13.5px;color:#8B85A3;line-height:1.9}
.note{margin-top:36px;font-size:11.5px;color:#8B85A3;text-align:center;line-height:2.2}
</style>
</head>
<body>
<div class="w">
  <h1>みづき セールスレター</h1>
  <div class="sub">PREVIEW</div>

  <a class="card" href="./kantei/">
    <div class="no">LP 01</div>
    <div class="ttl">本鑑定のご案内</div>
    <div class="desc">無料鑑定を受け取った方 → 月読の章 4,980円 / 神言降ろしの本鑑定 9,980円</div>
  </a>

  <a class="card" href="./bansou/">
    <div class="no">LP 02</div>
    <div class="ttl">月読の伴走</div>
    <div class="desc">本鑑定を受け取った方 → 伴走サポート 2週間 / 1ヶ月 / 3ヶ月 / 6ヶ月</div>
  </a>

  <div class="note">
    確認用のプレビューページです<br>
    検索エンジンには表示されません
  </div>
</div>
</body>
</html>
